[project]
name = "sonication-replay-engine"
version = "2.0.15"
description = "RC2 R0015 Hub Dataset Auto-Load Fix"
requires-python = ">=3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2.2,<3",
  "pyqtgraph>=0.13.7,<1"
]

[tool.nuitka]
standalone = true
enable-plugin = ["pyside6"]
windows-console-mode = "disable"
assume-yes-for-downloads = true
output-filename = "Sonication_Replay_Engine.exe"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
