name: Build Complaint Service Hub 0003u39c

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows standalone
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create writable build temp folders
        shell: pwsh
        run: |
          $temp = Join-Path $env:GITHUB_WORKSPACE '.build_temp'
          $cache = Join-Path $env:GITHUB_WORKSPACE '.nuitka_cache'
          New-Item -ItemType Directory -Force -Path $temp, $cache | Out-Null
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NUITKA_CACHE_DIR=$cache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TEMP=$temp"
          Write-Host "NUITKA_CACHE_DIR=$cache"

      - name: Build Nuitka standalone package
        shell: cmd
        run: call BUILD_EXE.bat

      - name: Verify standalone artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist/Complaint_Service_Hub'
          $required = @(
            'Complaint_Service_Hub_Launcher.exe',
            'Complaint_Service_Hub.exe',
            'Complaint_Service_Hub_Updater.exe',
            'version.json',
            'app_version.json',
            'manifest.json',
            'BUILD_INFO.txt'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $root $name))) { throw "Missing artifact: $name" }
          }
          $info = Get-Content (Join-Path $root 'BUILD_INFO.txt') -Raw
          if ($info -notmatch 'BuildMode=standalone') { throw 'Incorrect build mode' }
          if ($info -notmatch 'BuildEngine=Nuitka') { throw 'Incorrect build engine' }
          if ($info -notmatch 'Build=0003u39c') { throw 'Incorrect build number' }

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Complaint_Service_Hub_0003u39c_Windows_Standalone
          path: dist/Complaint_Service_Hub/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
