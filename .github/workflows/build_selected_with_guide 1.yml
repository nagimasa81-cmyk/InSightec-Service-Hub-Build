name: Build Selected Module With Guide

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: Select module to build with Guide / Guided Tour enabled
        required: true
        type: choice
        default: DO_Analysis
        options:
          - DO_Analysis
          - trackerSNR
          - Log_explorer
          - FFT
          - Soni
          - VIMeasure
      source_zip:
        description: Optional SOURCE ZIP base name. Leave blank to select the highest contracted release.
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  INSIGHTEC_RELEASE_MODE: "0"
  INSIGHTEC_EXTERNAL_TOOL_ASSEMBLY: "0"
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install common build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade pyinstaller nuitka ordered-set zstandard

      - name: Resolve and extract selected SOURCE
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $moduleFolder = "${{ inputs.module_name }}"
          $moduleDir = Join-Path $env:GITHUB_WORKSPACE ("Module\" + $moduleFolder)
          if (-not (Test-Path -LiteralPath $moduleDir -PathType Container)) {
            throw "Module folder is missing: $moduleDir"
          }

          $moduleIdMap = @{
            "DO_Analysis"  = "DOanalysis"
            "trackerSNR"   = "TrackerSNR"
            "Log_explorer" = "LogExplorer"
            "FFT"          = "FUSImageExplore"
            "Soni"         = "SonicationAnalysis"
            "VIMeasure"    = "VIMeasure"
          }
          $expectedModuleId = $moduleIdMap[$moduleFolder]
          if (-not $expectedModuleId) {
            throw "Unsupported module selection: $moduleFolder"
          }

          $tempRoot = Join-Path $env:RUNNER_TEMP "guide-build-source"
          $rebuiltRoot = Join-Path $tempRoot "rebuilt"
          $extractRoot = Join-Path $tempRoot "extracted"
          Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $rebuiltRoot, $extractRoot -Force | Out-Null

          function Test-ContractedZip {
            param(
              [Parameter(Mandatory=$true)][string]$ZipPath,
              [Parameter(Mandatory=$true)][string]$ExpectedModuleId
            )
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [IO.Compression.ZipFile]::OpenRead($ZipPath)
            try {
              $matches = @()
              foreach ($entry in $archive.Entries) {
                if ($entry.FullName -notmatch '(?i)insightec_build_contract\.json$') { continue }
                $reader = New-Object IO.StreamReader($entry.Open())
                try { $contract = ($reader.ReadToEnd() | ConvertFrom-Json) }
                finally { $reader.Dispose() }
                if ($contract.module_id -eq $ExpectedModuleId) {
                  $matches += [PSCustomObject]@{
                    Contract = $contract
                    Member = $entry.FullName
                  }
                }
              }
              if ($matches.Count -eq 1) { return $matches[0] }
              if ($matches.Count -gt 1) { throw "Multiple contracts for $ExpectedModuleId in $ZipPath" }
              return $null
            }
            finally { $archive.Dispose() }
          }

          $requested = "${{ inputs.source_zip }}".Trim()
          $zipCandidates = @()

          if ($requested) {
            $normal = Join-Path $moduleDir $requested
            if (Test-Path -LiteralPath $normal -PathType Leaf) {
              $zipCandidates += Get-Item -LiteralPath $normal
            }
            else {
              $partPattern = $requested + ".part*"
              $parts = @(Get-ChildItem -LiteralPath $moduleDir -File -Filter $partPattern | Sort-Object Name)
              if ($parts.Count -eq 0) { throw "Requested SOURCE was not found: $requested" }
              $rebuilt = Join-Path $rebuiltRoot $requested
              $expectedPart = 1
              $out = [IO.File]::Open($rebuilt, [IO.FileMode]::Create)
              try {
                foreach ($part in $parts) {
                  if ($part.Name -notmatch '\.part(\d+)$') { continue }
                  $partNo = [int]$Matches[1]
                  if ($partNo -ne $expectedPart) { throw "Missing split part $expectedPart before $($part.Name)" }
                  if ($part.Length -le 0 -or $part.Length -ge 25MB) { throw "Invalid split part size: $($part.Name)" }
                  $input = [IO.File]::OpenRead($part.FullName)
                  try { $input.CopyTo($out) } finally { $input.Dispose() }
                  $expectedPart++
                }
              }
              finally { $out.Dispose() }
              $zipCandidates += Get-Item -LiteralPath $rebuilt
            }
          }
          else {
            $zipCandidates += @(Get-ChildItem -LiteralPath $moduleDir -Recurse -File | Where-Object { $_.Name -match '(?i)_SOURCE\.zip$' })
            $partGroups = Get-ChildItem -LiteralPath $moduleDir -Recurse -File | Where-Object { $_.Name -match '(?i)^(.+\.zip)\.part\d+$' } | Group-Object { $_.Name -replace '(?i)\.part\d+$','' }
            foreach ($group in $partGroups) {
              $rebuilt = Join-Path $rebuiltRoot $group.Name
              $parts = @($group.Group | Sort-Object Name)
              $expectedPart = 1
              $out = [IO.File]::Open($rebuilt, [IO.FileMode]::Create)
              try {
                foreach ($part in $parts) {
                  $part.Name -match '\.part(\d+)$' | Out-Null
                  $partNo = [int]$Matches[1]
                  if ($partNo -ne $expectedPart) { throw "Missing split part $expectedPart before $($part.Name)" }
                  if ($part.Length -le 0 -or $part.Length -ge 25MB) { throw "Invalid split part size: $($part.Name)" }
                  $input = [IO.File]::OpenRead($part.FullName)
                  try { $input.CopyTo($out) } finally { $input.Dispose() }
                  $expectedPart++
                }
              }
              finally { $out.Dispose() }
              $zipCandidates += Get-Item -LiteralPath $rebuilt
            }
          }

          $valid = @()
          foreach ($zip in $zipCandidates) {
            try {
              $match = Test-ContractedZip -ZipPath $zip.FullName -ExpectedModuleId $expectedModuleId
              if ($match) {
                $valid += [PSCustomObject]@{
                  Zip = $zip
                  Contract = $match.Contract
                  Member = $match.Member
                  Sequence = [int]$match.Contract.release_sequence
                }
              }
            }
            catch {
              Write-Warning "$($zip.Name): $($_.Exception.Message)"
            }
          }
          if ($valid.Count -eq 0) {
            throw "No contracted SOURCE for $expectedModuleId was found in $moduleDir"
          }

          $selected = $valid | Sort-Object Sequence, @{Expression={$_.Zip.LastWriteTimeUtc}} -Descending | Select-Object -First 1
          $sameSequence = @($valid | Where-Object { $_.Sequence -eq $selected.Sequence })
          if (-not $requested -and $sameSequence.Count -gt 1) {
            $hashes = @($sameSequence | ForEach-Object { (Get-FileHash -LiteralPath $_.Zip.FullName -Algorithm SHA256).Hash } | Select-Object -Unique)
            if ($hashes.Count -gt 1) {
              throw "Ambiguous SOURCE packages share release_sequence=$($selected.Sequence). Remove obsolete files or specify source_zip."
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($selected.Zip.FullName, $extractRoot, $true)
          $contractRelative = Split-Path -Parent $selected.Member
          $appRoot = if ($contractRelative) { Join-Path $extractRoot $contractRelative } else { $extractRoot }
          if (-not (Test-Path -LiteralPath $appRoot -PathType Container)) { throw "Extracted application root missing: $appRoot" }

          $contract = $selected.Contract
          $buildFile = Join-Path $appRoot ([string]$contract.build.file)
          if (-not (Test-Path -LiteralPath $buildFile -PathType Leaf)) { throw "Contract build file missing: $buildFile" }

          # Modules that historically contain a Guide must still retain the release-mode switch and Guide code.
          $guideExpected = $expectedModuleId -in @("DOanalysis", "TrackerSNR", "LogExplorer", "FUSImageExplore")
          if ($guideExpected) {
            $pythonText = (Get-ChildItem -LiteralPath $appRoot -Recurse -File -Filter "*.py" | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue }) -join "`n"
            if ($pythonText -notmatch 'INSIGHTEC_RELEASE_MODE') {
              throw "$expectedModuleId does not contain the INSIGHTEC_RELEASE_MODE switch. A guide-capable SOURCE is required."
            }
            if ($pythonText -notmatch '(?i)guide|tour') {
              throw "$expectedModuleId appears to have no Guide / Tour implementation in this SOURCE."
            }
          }

          "module_id=$expectedModuleId" >> $env:GITHUB_OUTPUT
          "app_root=$appRoot" >> $env:GITHUB_OUTPUT
          "build_file=$buildFile" >> $env:GITHUB_OUTPUT
          "source_name=$($selected.Zip.Name)" >> $env:GITHUB_OUTPUT
          "source_version=$($contract.source_version)" >> $env:GITHUB_OUTPUT
          "release_sequence=$($selected.Sequence)" >> $env:GITHUB_OUTPUT
          "expected_patterns=$([string]::Join('|', @($contract.build.expected_exe_patterns)))" >> $env:GITHUB_OUTPUT
          "output_directories=$([string]::Join('|', @($contract.build.output_directories)))" >> $env:GITHUB_OUTPUT

          Write-Host "Selected SOURCE : $($selected.Zip.Name)"
          Write-Host "Module ID       : $expectedModuleId"
          Write-Host "Source version  : $($contract.source_version)"
          Write-Host "Release sequence: $($selected.Sequence)"
          Write-Host "Build file      : $buildFile"
          Write-Host "Guide mode      : INSIGHTEC_RELEASE_MODE=0"

      - name: Build selected module with Guide enabled
        id: build
        shell: pwsh
        env:
          INSIGHTEC_RELEASE_MODE: "0"
          INSIGHTEC_EXTERNAL_TOOL_ASSEMBLY: "0"
        run: |
          $ErrorActionPreference = "Stop"
          $appRoot = "${{ steps.source.outputs.app_root }}"
          $buildFile = "${{ steps.source.outputs.build_file }}"

          Write-Host "INSIGHTEC_RELEASE_MODE=$env:INSIGHTEC_RELEASE_MODE"
          Write-Host "Building from: $appRoot"
          Push-Location $appRoot
          try {
            $extension = [IO.Path]::GetExtension($buildFile).ToLowerInvariant()
            if ($extension -eq ".bat" -or $extension -eq ".cmd") {
              & cmd.exe /d /c call $buildFile
            }
            elseif ($extension -eq ".ps1") {
              & pwsh -NoProfile -ExecutionPolicy Bypass -File $buildFile
            }
            elseif ($extension -eq ".py") {
              & python $buildFile
            }
            else {
              throw "Unsupported build file type: $buildFile"
            }
            if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

          $patterns = "${{ steps.source.outputs.expected_patterns }}" -split '\|'
          $outputDirs = "${{ steps.source.outputs.output_directories }}" -split '\|'
          $exeCandidates = @()
          foreach ($dirName in $outputDirs) {
            if (-not $dirName) { continue }
            $dir = Join-Path $appRoot $dirName
            if (Test-Path -LiteralPath $dir -PathType Container) {
              $exeCandidates += @(Get-ChildItem -LiteralPath $dir -Recurse -File -Filter "*.exe")
            }
          }
          if ($exeCandidates.Count -eq 0) {
            $exeCandidates = @(Get-ChildItem -LiteralPath $appRoot -Recurse -File -Filter "*.exe" | Where-Object { $_.FullName -notmatch '(?i)\\build\\|\\\.venv' })
          }

          $selectedExe = $null
          foreach ($pattern in $patterns) {
            if (-not $pattern) { continue }
            $selectedExe = $exeCandidates | Where-Object { $_.Name -like $pattern } | Sort-Object Length -Descending | Select-Object -First 1
            if ($selectedExe) { break }
          }
          if (-not $selectedExe) {
            $selectedExe = $exeCandidates | Where-Object { $_.Length -gt 100KB } | Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $selectedExe) { throw "No valid output EXE was found after build." }

          $artifactDir = Join-Path $env:RUNNER_TEMP ("GuideBuild_" + "${{ steps.source.outputs.module_id }}")
          Remove-Item -LiteralPath $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $exeParent = $selectedExe.Directory.FullName
          Get-ChildItem -LiteralPath $exeParent -Force | Copy-Item -Destination $artifactDir -Recurse -Force

          @"
          Module: ${{ steps.source.outputs.module_id }}
          Source: ${{ steps.source.outputs.source_name }}
          Version: ${{ steps.source.outputs.source_version }}
          Release sequence: ${{ steps.source.outputs.release_sequence }}
          Guide mode: enabled (INSIGHTEC_RELEASE_MODE=0)
          Startup EXE: $($selectedExe.Name)
          "@ | Set-Content -LiteralPath (Join-Path $artifactDir "GUIDE_BUILD_INFO.txt") -Encoding UTF8

          "artifact_dir=$artifactDir" >> $env:GITHUB_OUTPUT
          "startup_exe=$($selectedExe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Guide-enabled artifact prepared: $artifactDir"
          Write-Host "Startup EXE: $($selectedExe.Name)"

      - name: Upload guide-enabled module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.module_id }}_WITH_GUIDE_${{ steps.source.outputs.source_version }}
          path: ${{ steps.build.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14
