name: Deploy Energy Graph Scan module to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify Spectrum Reader module
        shell: bash
        run: |
          test -f Module/spectrumreader/index.html
          test -f Module/spectrumreader/sw.js
          test -f Module/spectrumreader/manifest.webmanifest
          test -f Module/spectrumreader/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
