name: Build Selected Module RC1 Dual Runtime

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: "Select Module"
        required: true
        type: choice
        options:
          - Soni
          - ExAna
          - FFT
          - trackerSNR
          - Water_system_analyzer
          - WS_Investigation
          - Log_explorer
          - Complaint_service_hub
          - InSightec_Service_hub
          - HUB
          - FileTypeBuilder
          - FUSSIM
          - SPC
      runtime:
        description: "Build runtime: auto uses .github/build-runtime-map.json"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - r5
          - r6
      source_zip:
        description: "Optional exact SOURCE ZIP filename. Blank uses latest filename."
        required: false
        default: ""
        type: string
      build_engine:
        description: "Build engine"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fast_pyinstaller
          - nuitka_standalone
      entry_point_override:
        description: "Optional exact relative Python entry point."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  RUNTIME_MAP_PATH: .github/build-runtime-map.json

jobs:
  resolve-runtime:
    name: Resolve build runtime
    runs-on: windows-latest
    outputs:
      runtime: ${{ steps.resolve.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve R5 or R6
        id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requested = "${{ inputs.runtime }}".Trim().ToLowerInvariant()
          $moduleName = "${{ inputs.module_name }}".Trim()

          if ($requested -in @("r5", "r6")) {
            $resolved = $requested
            Write-Host "Explicit runtime selected: $resolved"
          }
          elseif ($requested -eq "auto") {
            $mapPath = Join-Path $env:GITHUB_WORKSPACE $env:RUNTIME_MAP_PATH
            if (-not (Test-Path $mapPath -PathType Leaf)) {
              throw "Runtime map was not found: $mapPath"
            }

            try {
              $map = Get-Content -LiteralPath $mapPath -Raw | ConvertFrom-Json
            }
            catch {
              throw "Runtime map JSON is invalid: $mapPath`n$($_.Exception.Message)"
            }

            $resolved = [string]$map.default_runtime
            if ([string]::IsNullOrWhiteSpace($resolved)) {
              $resolved = "r5"
            }

            $property = $map.modules.PSObject.Properties[$moduleName]
            if ($null -ne $property -and -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
              $resolved = ([string]$property.Value).Trim().ToLowerInvariant()
            }

            Write-Host "Auto runtime mapping: $moduleName -> $resolved"
          }
          else {
            throw "Unsupported runtime input: $requested"
          }

          if ($resolved -notin @("r5", "r6")) {
            throw "Resolved runtime must be r5 or r6, but was: $resolved"
          }

          "runtime=$resolved" >> $env:GITHUB_OUTPUT

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Selected build runtime
          - Module: `${{ inputs.module_name }}`
          - Requested: `${{ inputs.runtime }}`
          - Resolved: `${{ steps.resolve.outputs.runtime }}`
          - Source ZIP: `${{ inputs.source_zip || 'latest by filename' }}`
          - Build engine: `${{ inputs.build_engine }}`
          "@ >> $env:GITHUB_STEP_SUMMARY

  build-r5:
    name: Build with R5
    needs: resolve-runtime
    if: needs.resolve-runtime.outputs.runtime == 'r5'
    uses: ./.github/workflows/build_selected_runtime_r5.yml
    with:
      module_name: ${{ inputs.module_name }}
      source_zip: ${{ inputs.source_zip }}
      build_engine: ${{ inputs.build_engine }}
      entry_point_override: ${{ inputs.entry_point_override }}
    secrets: inherit

  build-r6:
    name: Build with R6
    needs: resolve-runtime
    if: needs.resolve-runtime.outputs.runtime == 'r6'
    uses: ./.github/workflows/build_selected_runtime_r6.yml
    with:
      module_name: ${{ inputs.module_name }}
      source_zip: ${{ inputs.source_zip }}
      build_engine: ${{ inputs.build_engine }}
      entry_point_override: ${{ inputs.entry_point_override }}
    secrets: inherit
