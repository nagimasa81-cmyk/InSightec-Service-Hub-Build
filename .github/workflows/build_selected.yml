name: Build Selected RC9

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build Target
        required: true
        type: choice
        default: Service Hub
        options: [Service Hub, Module]
      module_name:
        description: Module (used only for Module build)
        required: true
        type: choice
        default: DO_Analysis
        options:
          - DO_Analysis
          - Log_explorer
          - trackerSNR
          - FFT
          - Soni
          - VIMeasure
      hub_variant:
        description: Hub Variant
        required: true
        type: choice
        default: Card Launcher
        options: [Card Launcher, ZIP Drop]
      hub_guide:
        description: Hub Guide
        required: true
        type: boolean
        default: false
      module_guide:
        description: Module Guide
        required: true
        type: boolean
        default: false
      source_zip:
        description: Optional exact SOURCE ZIP filename
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  INPUT_BUILD_TARGET: ${{ inputs.build_target }}
  INPUT_MODULE_NAME: ${{ inputs.module_name }}
  INPUT_HUB_VARIANT: ${{ inputs.hub_variant == 'Card Launcher' && 'card_launcher' || 'zip_drop' }}
  INPUT_HUB_GUIDE: ${{ inputs.hub_guide }}
  INPUT_MODULE_GUIDE: ${{ inputs.module_guide }}
  INPUT_SOURCE_ZIP: ${{ inputs.source_zip }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Restore RC9 build cache
        uses: actions/cache@v4
        with:
          path: .rc9_cache
          key: rc9-${{ runner.os }}-py314-${{ github.run_id }}
          restore-keys: |
            rc9-${{ runner.os }}-py314-
      - name: RC9 unified build
        id: build
        shell: pwsh
        run: python scripts/build.py
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 6
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RC9_Build_Diagnostics_${{ inputs.build_target }}_${{ inputs.module_name }}
          path: artifacts/BUILD_FAILURE_*
          if-no-files-found: warn
          compression-level: 6
