name: Build Selected RC9

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build Target
        required: true
        type: choice
        default: Service Hub
        options: [Service Hub, Module]
      module_name:
        description: Module folder name (used only for Module build)
        required: false
        type: string
        default: DO_Analysis
      hub_variant:
        description: Hub Variant
        required: true
        type: choice
        default: Card Launcher
        options: [Card Launcher, ZIP Drop]
      hub_guide:
        description: Hub Guide
        required: true
        type: boolean
        default: false
      module_guide:
        description: Module Guide
        required: true
        type: boolean
        default: false
      source_zip:
        description: Optional exact SOURCE ZIP filename
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  INPUT_BUILD_TARGET: ${{ inputs.build_target }}
  INPUT_MODULE_NAME: ${{ inputs.module_name }}
  INPUT_HUB_VARIANT: ${{ inputs.hub_variant == 'Card Launcher' && 'card_launcher' || 'zip_drop' }}
  INPUT_HUB_GUIDE: ${{ inputs.hub_guide }}
  INPUT_MODULE_GUIDE: ${{ inputs.module_guide }}
  INPUT_SOURCE_ZIP: ${{ inputs.source_zip }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Restore RC9 build cache
        uses: actions/cache@v4
        with:
          path: .rc9_cache
          key: rc9-${{ runner.os }}-py314-${{ github.run_id }}
          restore-keys: |
            rc9-${{ runner.os }}-py314-
      - name: RC9 unified build
        shell: pwsh
        run: python scripts/build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RC9-${{ inputs.build_target }}-${{ inputs.module_name || 'ServiceHub' }}
          path: |
            artifacts/*.zip
            artifacts/*.triple_check.json
          if-no-files-found: error
          compression-level: 0
