name: Build Selected Module RC2 - Clean Source Build

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: Select Module
        required: true
        type: choice
        options:
          - Soni
          - VIMeasure
          - ExAna
          - FFT
          - trackerSNR
          - Water_system_analyzer
          - WS_Investigation
          - Log_explorer
          - Complaint_service_hub
          - InSightec_Service_hub
          - HUB
          - DO Analysis
          - FileTypeBuilder
          - FUSSIM
          - SPC
      source_zip:
        description: Optional SOURCE ZIP filename. Normal .zip and split .zip.part001 sets are supported.
        required: false
        default: ""
        type: string
      entry_point_override:
        description: Optional Python entry point relative to the extracted source root.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rc2-build-${{ inputs.module_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and reassemble SOURCE ZIP
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $moduleName = "${{ inputs.module_name }}".Trim()
          if ([string]::IsNullOrWhiteSpace($moduleName)) {
            throw "module_name is required."
          }

          $moduleDir = Join-Path $env:GITHUB_WORKSPACE ("Module\" + $moduleName)
          if (-not (Test-Path -LiteralPath $moduleDir -PathType Container)) {
            Write-Host "Available module folders:"
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "Module") -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host (" - " + $_.Name) }
            throw "Module folder was not found: $moduleDir"
          }

          $requested = "${{ inputs.source_zip }}".Trim()
          if ($requested) {
            $requested = [System.IO.Path]::GetFileName($requested)
            $requested = $requested -replace '(?i)\.part\d+$', ''
            if ($requested -notmatch '(?i)\.zip$') {
              $requested += ".zip"
            }
          }

          $files = @(Get-ChildItem -LiteralPath $moduleDir -Recurse -File)
          $normalZips = @(
            $files |
              Where-Object { $_.Name -match '(?i)_SOURCE\.zip$' } |
              Sort-Object LastWriteTimeUtc -Descending
          )

          $partFiles = @(
            $files |
              Where-Object { $_.Name -match '(?i)\.zip\.part\d{3,}$' }
          )

          $groups = @{}
          foreach ($part in $partFiles) {
            if ($part.Name -match '^(?<base>.+\.zip)\.part(?<number>\d{3,})$') {
              $base = $Matches.base
              if (-not $groups.ContainsKey($base)) {
                $groups[$base] = [System.Collections.Generic.List[object]]::new()
              }
              $groups[$base].Add($part)
            }
          }

          $selectedNormal = $null
          $selectedBase = $null
          $selectedParts = @()

          if ($requested) {
            $matchingBase = @($groups.Keys | Where-Object { $_ -ieq $requested } | Select-Object -First 1)
            if ($matchingBase.Count -gt 0) {
              $selectedBase = [string]$matchingBase[0]
              $selectedParts = @($groups[$selectedBase])
            } else {
              $selectedNormal = $normalZips | Where-Object { $_.Name -ieq $requested } | Select-Object -First 1
            }
          } else {
            $splitSets = @(
              foreach ($base in $groups.Keys) {
                $setParts = @($groups[$base])
                [pscustomobject]@{
                  Base = [string]$base
                  Parts = $setParts
                  Latest = ($setParts | Measure-Object LastWriteTimeUtc -Maximum).Maximum
                }
              }
            )

            $newestSplit = $splitSets | Sort-Object Latest -Descending | Select-Object -First 1
            $newestNormal = $normalZips | Select-Object -First 1

            if ($newestSplit -and (-not $newestNormal -or $newestSplit.Latest -ge $newestNormal.LastWriteTimeUtc)) {
              $selectedBase = $newestSplit.Base
              $selectedParts = @($newestSplit.Parts)
            } else {
              $selectedNormal = $newestNormal
            }
          }

          if (-not $selectedNormal -and $selectedParts.Count -eq 0) {
            Write-Host "Files under selected module:"
            $files | ForEach-Object { Write-Host (" - " + $_.FullName) }
            throw "No *_SOURCE.zip or *.zip.part001 SOURCE set was found under: $moduleDir"
          }

          $workDir = Join-Path $env:RUNNER_TEMP "rc2_source"
          Remove-Item -LiteralPath $workDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          if ($selectedParts.Count -gt 0) {
            $selectedParts = @(
              $selectedParts |
                Sort-Object { [int]([regex]::Match($_.Name, '\.part(\d+)$').Groups[1].Value) }
            )

            $expected = 1
            foreach ($part in $selectedParts) {
              $match = [regex]::Match($part.Name, '\.part(\d+)$')
              if (-not $match.Success) {
                throw "Invalid split part name: $($part.Name)"
              }
              $number = [int]$match.Groups[1].Value
              if ($number -ne $expected) {
                throw ("Split SOURCE is incomplete. Expected part{0:D3}, found {1}" -f $expected, $part.Name)
              }
              if ($part.Length -le 0) {
                throw "Split part is empty: $($part.Name)"
              }
              if ($part.Length -ge 25MB) {
                throw "Split part must be smaller than 25 MB: $($part.Name)"
              }
              $expected++
            }

            $sourceZip = Join-Path $workDir $selectedBase
            $outputStream = [System.IO.File]::Open($sourceZip, [System.IO.FileMode]::Create)
            try {
              foreach ($part in $selectedParts) {
                Write-Host ("Appending " + $part.Name)
                $inputStream = [System.IO.File]::OpenRead($part.FullName)
                try {
                  $inputStream.CopyTo($outputStream)
                } finally {
                  $inputStream.Dispose()
                }
              }
            } finally {
              $outputStream.Dispose()
            }
          } else {
            $sourceZip = Join-Path $workDir $selectedNormal.Name
            Copy-Item -LiteralPath $selectedNormal.FullName -Destination $sourceZip -Force
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($sourceZip)
          try {
            if ($archive.Entries.Count -eq 0) {
              throw "SOURCE ZIP is empty."
            }
            Write-Host ("SOURCE ZIP entries: " + $archive.Entries.Count)
          } finally {
            $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash
          Write-Host ("SOURCE ZIP : " + $sourceZip)
          Write-Host ("SHA-256   : " + $hash)

          "source_zip=$sourceZip" >> $env:GITHUB_OUTPUT
          "module_dir=$moduleDir" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract SOURCE and locate application root
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractDir = Join-Path $env:RUNNER_TEMP "rc2_extracted"
          Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          Expand-Archive -LiteralPath "${{ steps.source.outputs.source_zip }}" -DestinationPath $extractDir -Force

          $root = $extractDir
          $topDirectories = @(Get-ChildItem -LiteralPath $extractDir -Directory)
          $topFiles = @(Get-ChildItem -LiteralPath $extractDir -File)
          if ($topDirectories.Count -eq 1 -and $topFiles.Count -eq 0) {
            $root = $topDirectories[0].FullName
          }

          $moduleName = "${{ inputs.module_name }}"
          if ($moduleName -ieq "InSightec_Service_hub") {
            $hubFile = Get-ChildItem -LiteralPath $extractDir -Recurse -File -Filter "InSightecServiceHub.py" |
              Where-Object { $_.FullName -notmatch '(?i)[\\/](integrated_sources|tools|plugins|vendor|third_party)[\\/]' } |
              Sort-Object { $_.FullName.Length } |
              Select-Object -First 1
            if (-not $hubFile) {
              throw "InSightecServiceHub.py was not found outside child-source folders."
            }
            $root = $hubFile.Directory.FullName
          }

          Write-Host ("Application root: " + $root)
          Get-ChildItem -LiteralPath $root -Force | Select-Object Name, Length, LastWriteTime
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip setuptools wheel

          if (Test-Path -LiteralPath "requirements-build.txt") {
            python -m pip install -r requirements-build.txt
          } elseif (Test-Path -LiteralPath "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          # Ensure the generic fallback builder is available.
          python -m pip install pyinstaller

      - name: Resolve build method and entry point
        id: plan
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${{ steps.locate.outputs.root }}"
          $moduleName = "${{ inputs.module_name }}"
          $override = "${{ inputs.entry_point_override }}".Trim()

          $mode = ""
          $buildFile = ""
          $entryPoint = ""

          $preferredBat = Join-Path $root "01_BUILD_EXE.bat"
          if (Test-Path -LiteralPath $preferredBat -PathType Leaf) {
            $mode = "bat"
            $buildFile = $preferredBat
          } else {
            $rootSpecs = @(Get-ChildItem -LiteralPath $root -File -Filter "*.spec" | Sort-Object Name)
            if ($rootSpecs.Count -gt 0) {
              $mode = "spec"
              $buildFile = $rootSpecs[0].FullName
            } else {
              if ($override) {
                $candidate = Join-Path $root $override
                if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                  throw "entry_point_override was not found: $candidate"
                }
                $entryPoint = $candidate
              } elseif ($moduleName -ieq "InSightec_Service_hub") {
                $entryPoint = Join-Path $root "InSightecServiceHub.py"
              } else {
                $preferredNames = @("main.py", "app.py", "launcher.py")
                foreach ($name in $preferredNames) {
                  $candidate = Join-Path $root $name
                  if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                    $entryPoint = $candidate
                    break
                  }
                }
                if (-not $entryPoint) {
                  $rootPython = @(
                    Get-ChildItem -LiteralPath $root -File -Filter "*.py" |
                      Where-Object { $_.Name -notmatch '(?i)^(setup|build|validate|test|conftest)' } |
                      Sort-Object Name
                  )
                  if ($rootPython.Count -eq 1) {
                    $entryPoint = $rootPython[0].FullName
                  }
                }
              }

              if (-not $entryPoint -or -not (Test-Path -LiteralPath $entryPoint -PathType Leaf)) {
                throw "No root build BAT, SPEC, or unambiguous Python entry point was found."
              }
              $mode = "pyinstaller"
            }
          }

          Write-Host ("Build mode : " + $mode)
          Write-Host ("Build file : " + $buildFile)
          Write-Host ("Entry point: " + $entryPoint)
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "build_file=$buildFile" >> $env:GITHUB_OUTPUT
          "entry_point=$entryPoint" >> $env:GITHUB_OUTPUT

      - name: Build application
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"
          $mode = "${{ steps.plan.outputs.mode }}"

          if ($mode -eq "bat") {
            Write-Host "Running dedicated build BAT."
            & cmd.exe /d /c call "${{ steps.plan.outputs.build_file }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Build BAT failed with exit code $LASTEXITCODE"
            }
          } elseif ($mode -eq "spec") {
            python -m PyInstaller --noconfirm --clean "${{ steps.plan.outputs.build_file }}"
          } elseif ($mode -eq "pyinstaller") {
            $entry = "${{ steps.plan.outputs.entry_point }}"
            $name = [System.IO.Path]::GetFileNameWithoutExtension($entry)
            python -m PyInstaller --noconfirm --clean --windowed --name $name $entry
          } else {
            throw "Unsupported build mode: $mode"
          }

      - name: Locate and validate build output
        id: artifact
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${{ steps.locate.outputs.root }}"
          $dist = Join-Path $root "dist"
          if (-not (Test-Path -LiteralPath $dist -PathType Container)) {
            throw "Build output directory was not found: $dist"
          }

          $moduleName = "${{ inputs.module_name }}"
          $packageDir = $null
          $startupExe = $null

          if ($moduleName -ieq "InSightec_Service_hub") {
            $knownHubDirs = @(
              (Join-Path $dist "InSightecServiceHub"),
              (Join-Path $dist "InSightec_APAC_Service_Hub")
            )
            foreach ($candidateDir in $knownHubDirs) {
              if (Test-Path -LiteralPath $candidateDir -PathType Container) {
                $packageDir = Get-Item -LiteralPath $candidateDir
                break
              }
            }

            if ($packageDir) {
              $knownHubExes = @(
                (Join-Path $packageDir.FullName "InSightecServiceHub.exe"),
                (Join-Path $packageDir.FullName "InSightec_APAC_Service_Hub.exe")
              )
              foreach ($candidateExe in $knownHubExes) {
                if (Test-Path -LiteralPath $candidateExe -PathType Leaf) {
                  $startupExe = Get-Item -LiteralPath $candidateExe
                  break
                }
              }
            }
          }

          if (-not $packageDir) {
            $distDirs = @(Get-ChildItem -LiteralPath $dist -Directory)
            if ($distDirs.Count -eq 1) {
              $packageDir = $distDirs[0]
            }
          }

          if ($packageDir -and -not $startupExe) {
            $rootExes = @(
              Get-ChildItem -LiteralPath $packageDir.FullName -File -Filter "*.exe" |
                Where-Object { $_.Name -notmatch '(?i)(uninstall|updater|debug|console|crash)' } |
                Sort-Object Length -Descending
            )
            if ($rootExes.Count -gt 0) {
              $startupExe = $rootExes[0]
            }
          }

          if (-not $packageDir) {
            $rootExes = @(
              Get-ChildItem -LiteralPath $dist -File -Filter "*.exe" |
                Where-Object { $_.Name -notmatch '(?i)(uninstall|updater|debug|console|crash)' } |
                Sort-Object Length -Descending
            )
            if ($rootExes.Count -eq 0) {
              Write-Host "dist tree:"
              Get-ChildItem -LiteralPath $dist -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "No application EXE was found under dist."
            }
            $packageDir = Get-Item -LiteralPath $dist
            $startupExe = $rootExes[0]
          }

          if (-not $startupExe -or -not (Test-Path -LiteralPath $startupExe.FullName -PathType Leaf)) {
            Write-Host "Selected package tree:"
            Get-ChildItem -LiteralPath $packageDir.FullName -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "No valid startup EXE was found in the configured application package."
          }

          if ($moduleName -ieq "InSightec_Service_hub") {
            $toolsDir = Join-Path $packageDir.FullName "tools"
            if (-not (Test-Path -LiteralPath $toolsDir -PathType Container)) {
              throw "Hub package is incomplete: tools folder is missing."
            }
          }

          $launcher = Join-Path $packageDir.FullName "RUN_APPLICATION.bat"
          $relativeExe = [System.IO.Path]::GetRelativePath($packageDir.FullName, $startupExe.FullName)
          @(
            "@echo off",
            "cd /d %~dp0",
            ('start "" "' + $relativeExe + '"')
          ) | Set-Content -LiteralPath $launcher -Encoding ASCII

          $info = Join-Path $packageDir.FullName "WORKFLOW_BUILD_INFO.txt"
          @(
            ("Module: " + $moduleName),
            ("Build mode: ${{ steps.plan.outputs.mode }}"),
            ("Startup EXE: " + $relativeExe),
            ("Commit: " + $env:GITHUB_SHA),
            ("Run ID: " + $env:GITHUB_RUN_ID)
          ) | Set-Content -LiteralPath $info -Encoding UTF8

          Write-Host ("Package directory: " + $packageDir.FullName)
          Write-Host ("Startup EXE      : " + $startupExe.FullName)
          "package_dir=$($packageDir.FullName)" >> $env:GITHUB_OUTPUT
          "startup_exe=$($startupExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create distribution ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $moduleName = "${{ inputs.module_name }}"
          $safeModule = $moduleName -replace '[^A-Za-z0-9._-]', '_'
          $outputDir = Join-Path $env:RUNNER_TEMP "rc2_artifact"
          Remove-Item -LiteralPath $outputDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $zipPath = Join-Path $outputDir ($safeModule + "_RC2_BUILD_" + $env:GITHUB_RUN_NUMBER + ".zip")
          $packageDir = "${{ steps.artifact.outputs.package_dir }}"
          $startupExe = "${{ steps.artifact.outputs.startup_exe }}"

          if (-not (Test-Path -LiteralPath $packageDir -PathType Container)) {
            throw "Package directory no longer exists: $packageDir"
          }
          if (-not (Test-Path -LiteralPath $startupExe -PathType Leaf)) {
            throw "Startup EXE no longer exists: $startupExe"
          }
          if (@(Get-ChildItem -LiteralPath $packageDir -Force).Count -eq 0) {
            throw "Package directory is empty: $packageDir"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $packageDir,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          $relativeStartupExe = [System.IO.Path]::GetRelativePath($packageDir, $startupExe).Replace('\', '/')
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            if ($archive.Entries.Count -eq 0) {
              throw "Distribution ZIP is empty."
            }
            $entryNames = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if ($entryNames -notcontains $relativeStartupExe) {
              throw "Distribution ZIP does not contain the startup EXE: $relativeStartupExe"
            }
            if ($entryNames -notcontains "RUN_APPLICATION.bat") {
              throw "Distribution ZIP does not contain RUN_APPLICATION.bat."
            }
            Write-Host ("Distribution entries: " + $archive.Entries.Count)
            Write-Host ("Verified startup EXE: " + $relativeStartupExe)
          } finally {
            $archive.Dispose()
          }

          Write-Host ("Distribution ZIP: " + $zipPath)
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "artifact_name=$($safeModule)_RC2_BUILD_$($env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_OUTPUT

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14
