name: Build Selected Module With Guide

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Select module to build"
        required: true
        type: choice
        options:
          - InSightec_Service_hub
          - DO_Analysis
          - trackerSNR
          - Log_explorer
          - Soni
          - FFT
          - VIMeasure

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      INSIGHTEC_RELEASE_MODE: "0"
      INSIGHTEC_EXTERNAL_TOOL_ASSEMBLY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install common build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard
          python -m pip install PySide6 numpy pandas matplotlib pyqtgraph pydicom openpyxl

      - name: Resolve selected module directory
        id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $selected = "${{ inputs.module }}"
          $moduleRoot = Join-Path $env:GITHUB_WORKSPACE "Module"

          if (-not (Test-Path -LiteralPath $moduleRoot -PathType Container)) {
            throw "Module root was not found: $moduleRoot"
          }

          $aliases = @{
            "InSightec_Service_hub" = "InSightec_Service_hub"
            "InSightec Service Hub" = "InSightec_Service_hub"
            "DO_Analysis" = "DO_Analysis"
            "DO Analysis" = "DO_Analysis"
            "trackerSNR" = "trackerSNR"
            "TrackerSNR" = "trackerSNR"
            "Log_explorer" = "Log_explorer"
            "Log Explorer" = "Log_explorer"
            "Soni" = "Soni"
            "SonicationAnalysis" = "Soni"
            "Sonication Analysis" = "Soni"
            "FFT" = "FFT"
            "FUS Image Explore" = "FFT"
            "VIMeasure" = "VIMeasure"
          }

          if ($aliases.ContainsKey($selected)) {
            $folderName = $aliases[$selected]
          }
          else {
            $folderName = $selected
          }

          $moduleDir = Join-Path $moduleRoot $folderName

          if (-not (Test-Path -LiteralPath $moduleDir -PathType Container)) {
            $available = Get-ChildItem -LiteralPath $moduleRoot -Directory |
              Select-Object -ExpandProperty Name |
              Sort-Object
            throw "Selected module directory was not found: $moduleDir`nAvailable Module folders:`n$($available -join "`n")"
          }

          "selected=$selected" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "folder_name=$folderName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "module_dir=$moduleDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Selected input : $selected"
          Write-Host "Resolved folder: $folderName"
          Write-Host "Module path    : $moduleDir"

      - name: Resolve and extract selected SOURCE
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $moduleDir = "${{ steps.resolve.outputs.module_dir }}"
          $workDir = Join-Path $env:RUNNER_TEMP "selected_source"

          if (Test-Path -LiteralPath $workDir) {
            Remove-Item -LiteralPath $workDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          $zipCandidates = Get-ChildItem -LiteralPath $moduleDir -File -Recurse |
            Where-Object { $_.Extension -ieq ".zip" } |
            Sort-Object LastWriteTimeUtc -Descending

          if (-not $zipCandidates) {
            $files = Get-ChildItem -LiteralPath $moduleDir -File -Recurse |
              Select-Object -ExpandProperty FullName
            throw "No SOURCE ZIP was found in: $moduleDir`nFiles found:`n$($files -join "`n")"
          }

          $sourceZip = $zipCandidates |
            Where-Object { $_.Name -match '(?i)source' } |
            Select-Object -First 1

          if (-not $sourceZip) {
            $sourceZip = $zipCandidates | Select-Object -First 1
          }

          Write-Host "Selected SOURCE ZIP: $($sourceZip.FullName)"
          Expand-Archive -LiteralPath $sourceZip.FullName -DestinationPath $workDir -Force

          $sourceRoot = $workDir
          for ($i = 0; $i -lt 4; $i++) {
            $children = @(Get-ChildItem -LiteralPath $sourceRoot -Force)
            $dirs = @($children | Where-Object { $_.PSIsContainer })
            $files = @($children | Where-Object { -not $_.PSIsContainer })

            if ($dirs.Count -eq 1 -and $files.Count -eq 0) {
              $sourceRoot = $dirs[0].FullName
            }
            else {
              break
            }
          }

          "source_zip=$($sourceZip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_root=$sourceRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Extracted SOURCE root: $sourceRoot"
          Get-ChildItem -LiteralPath $sourceRoot -Force | Format-Table Name, Length, LastWriteTime

      - name: Build selected module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRoot = "${{ steps.source.outputs.source_root }}"
          Set-Location -LiteralPath $sourceRoot

          $preferredBatNames = @(
            "01_BUILD_EXE_NUITKA.bat",
            "BUILD_EXE_NUITKA.bat",
            "build_exe.bat",
            "build.bat"
          )

          $buildBat = $null
          foreach ($name in $preferredBatNames) {
            $candidate = Get-ChildItem -LiteralPath $sourceRoot -File -Recurse -Filter $name |
              Select-Object -First 1
            if ($candidate) {
              $buildBat = $candidate
              break
            }
          }

          if (-not $buildBat) {
            $buildBat = Get-ChildItem -LiteralPath $sourceRoot -File -Recurse -Filter "*.bat" |
              Where-Object {
                $_.Name -match '(?i)build' -and
                $_.Name -notmatch '(?i)debug|run|clean'
              } |
              Select-Object -First 1
          }

          if ($buildBat) {
            Write-Host "Running build BAT: $($buildBat.FullName)"
            Push-Location -LiteralPath $buildBat.Directory.FullName
            try {
              cmd.exe /d /c "`"$($buildBat.FullName)`""
              if ($LASTEXITCODE -ne 0) {
                throw "Build BAT failed with exit code $LASTEXITCODE"
              }
            }
            finally {
              Pop-Location
            }
          }
          else {
            $spec = Get-ChildItem -LiteralPath $sourceRoot -File -Recurse -Filter "*.spec" |
              Select-Object -First 1

            if ($spec) {
              python -m pip install pyinstaller
              Push-Location -LiteralPath $spec.Directory.FullName
              try {
                python -m PyInstaller --noconfirm --clean $spec.FullName
                if ($LASTEXITCODE -ne 0) {
                  throw "PyInstaller failed with exit code $LASTEXITCODE"
                }
              }
              finally {
                Pop-Location
              }
            }
            else {
              $entry = Get-ChildItem -LiteralPath $sourceRoot -File -Recurse -Include "main.py","app.py","*_main.py" |
                Select-Object -First 1

              if (-not $entry) {
                throw "No supported build BAT, .spec, or Python entry point was found under: $sourceRoot"
              }

              Push-Location -LiteralPath $entry.Directory.FullName
              try {
                python -m nuitka --standalone --enable-plugin=pyside6 --assume-yes-for-downloads --output-dir=build $entry.FullName
                if ($LASTEXITCODE -ne 0) {
                  throw "Nuitka failed with exit code $LASTEXITCODE"
                }
              }
              finally {
                Pop-Location
              }
            }
          }

      - name: Collect distribution
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRoot = "${{ steps.source.outputs.source_root }}"
          $selected = "${{ steps.resolve.outputs.folder_name }}"
          $stage = Join-Path $env:RUNNER_TEMP "artifact_stage"

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $exeFiles = @(Get-ChildItem -LiteralPath $sourceRoot -File -Recurse -Filter "*.exe" |
            Where-Object {
              $_.FullName -notmatch '\\.venv\\|\\venv\\|\\Python\\|\\site-packages\\'
            })

          if ($exeFiles.Count -eq 0) {
            throw "Build completed but no EXE was found under: $sourceRoot"
          }

          $distDirs = @(Get-ChildItem -LiteralPath $sourceRoot -Directory -Recurse |
            Where-Object { $_.Name -match '(?i)\.dist$|dist$|distribution$' } |
            Sort-Object LastWriteTimeUtc -Descending)

          $copied = $false
          foreach ($dist in $distDirs) {
            $distExe = Get-ChildItem -LiteralPath $dist.FullName -File -Recurse -Filter "*.exe" |
              Select-Object -First 1
            if ($distExe) {
              Copy-Item -LiteralPath $dist.FullName -Destination (Join-Path $stage $dist.Name) -Recurse -Force
              $copied = $true
              break
            }
          }

          if (-not $copied) {
            foreach ($exe in $exeFiles) {
              Copy-Item -LiteralPath $exe.FullName -Destination $stage -Force
            }
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "$selected-GUIDE-enabled.zip"
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipPath -CompressionLevel Optimal

          "artifact_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$selected-GUIDE-enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload guide-enabled module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ steps.collect.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
