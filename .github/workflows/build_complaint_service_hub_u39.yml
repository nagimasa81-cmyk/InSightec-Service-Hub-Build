name: Build Complaint Service Hub u39

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.13'
          - '3.14'
      source_zip:
        description: Optional source ZIP path. Leave blank to use the latest ZIP in Module/Complaint_service_hub.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows standalone
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select source ZIP
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requested = '${{ inputs.source_zip }}'.Trim()
          if ($requested) {
            $zip = Join-Path $env:GITHUB_WORKSPACE $requested
            if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
              throw "Specified source ZIP was not found: $requested"
            }
          }
          else {
            $searchRoots = @(
              (Join-Path $env:GITHUB_WORKSPACE 'Module/Complaint_service_hub'),
              (Join-Path $env:GITHUB_WORKSPACE 'Module/Complaint_Service_Hub'),
              $env:GITHUB_WORKSPACE
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container }

            $candidates = foreach ($root in $searchRoots) {
              Get-ChildItem -LiteralPath $root -File -Filter '*.zip' -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match 'Complaint_Service_Hub' -and
                  $_.Name -notmatch '(?i)(artifact|distribution|program_update|master_update|built|release)'
                }
            }

            $zip = $candidates |
              Sort-Object LastWriteTimeUtc, Name -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $zip) {
              throw 'No Complaint Service Hub source ZIP was found.'
            }
          }

          Write-Host "Selected source ZIP: $zip"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Extract source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'complaint-source'
          if (Test-Path $sourceDir) {
            Remove-Item $sourceDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $sourceDir | Out-Null
          Expand-Archive -LiteralPath '${{ steps.source.outputs.zip }}' -DestinationPath $sourceDir -Force

          $buildFiles = Get-ChildItem -LiteralPath $sourceDir -Recurse -File -Filter 'BUILD_EXE.bat'
          if ($buildFiles.Count -ne 1) {
            throw "Expected exactly one BUILD_EXE.bat, found $($buildFiles.Count)."
          }

          $projectRoot = $buildFiles[0].Directory.FullName
          Write-Host "Project root: $projectRoot"
          "PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reject nested source ZIPs
        shell: pwsh
        run: |
          $nested = Get-ChildItem -LiteralPath $env:PROJECT_ROOT -Recurse -File -Filter '*.zip' -ErrorAction SilentlyContinue
          if ($nested) {
            $nested | ForEach-Object { Write-Host "Nested ZIP: $($_.FullName)" }
            throw 'The source package contains one or more nested ZIP files.'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ inputs.python_version }}'
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_ROOT }}/BUILD_EXE.bat
            ${{ env.PROJECT_ROOT }}/01_BUILD_EXE_NUITKA.bat

      - name: Show build metadata
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python --version
          Get-Content version.json
          Get-Content build_config.json

      - name: Build Complaint Service Hub
        shell: cmd
        working-directory: ${{ env.PROJECT_ROOT }}
        run: call BUILD_EXE.bat

      - name: Verify standalone distribution
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:PROJECT_ROOT 'dist/Complaint_Service_Hub'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Distribution folder was not created: $root"
          }

          $required = @(
            'Complaint_Service_Hub_Launcher.exe',
            'Complaint_Service_Hub.exe',
            'Complaint_Service_Hub_Updater.exe',
            'version.json',
            'app_version.json',
            'manifest.json',
            'BUILD_INFO.txt'
          )

          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required distribution file: $name"
            }
          }

          $unexpectedZips = Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.zip' -ErrorAction SilentlyContinue
          if ($unexpectedZips) {
            $unexpectedZips | ForEach-Object { Write-Host "Unexpected ZIP: $($_.FullName)" }
            throw 'The distribution contains a nested ZIP file.'
          }

          $info = Get-Content (Join-Path $root 'BUILD_INFO.txt') -Raw
          if ($info -notmatch 'BuildMode=standalone') { throw 'BUILD_INFO does not declare standalone mode.' }
          if ($info -notmatch 'BuildEngine=Nuitka') { throw 'BUILD_INFO does not declare Nuitka.' }

          $version = Get-Content (Join-Path $root 'version.json') -Raw | ConvertFrom-Json
          Write-Host "Validated version: $($version.version)"

      - name: Smoke-test executable presence
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $root = Join-Path $env:PROJECT_ROOT 'dist/Complaint_Service_Hub'
          Get-ChildItem -LiteralPath $root -File |
            Sort-Object Name |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Complaint_Service_Hub_0003u39_Windows_Standalone
          path: ${{ env.PROJECT_ROOT }}/dist/Complaint_Service_Hub/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
