name: Reusable Module Build
on:
  workflow_call:
    inputs:
      module_name: {required: true, type: string}
      python_version: {required: true, type: string}
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: Module/${{ inputs.module_name }}/**/*.zip
      - uses: actions/cache@v4
        with:
          path: |
            .build_cache
            .nuitka-cache
            .module-cache
            .builder-cache
          key: all-${{ runner.os }}-${{ inputs.python_version }}-${{ inputs.module_name }}-${{ hashFiles(format('Module/{0}/*.zip', inputs.module_name), 'scripts/**/*.py', 'config/module_registry.json') }}
          restore-keys: all-${{ runner.os }}-${{ inputs.python_version }}-${{ inputs.module_name }}-
      - run: python -m pip install --upgrade pip pyinstaller "Nuitka==4.1.3" ordered-set zstandard

      - id: build
        shell: pwsh
        run: python scripts/build_manager.py --module "${{ inputs.module_name }}"
      - name: Capture build environment
        if: always()
        shell: pwsh
        run: |
          $outDir = "Build_Diagnostics/Environment"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          python --version 2>&1 | Tee-Object "$outDir/python_version.txt"
          python -m pip --version 2>&1 | Tee-Object "$outDir/pip_version.txt"
          python -m pip freeze 2>&1 | Tee-Object "$outDir/pip_freeze.txt"

          $packages = @("PySide6", "shiboken6", "pyqtgraph", "numpy", "nuitka")
          foreach ($package in $packages) {
            $fileName = $package.ToLower() + ".txt"
            python -m pip show $package 2>&1 | Tee-Object (Join-Path $outDir $fileName)
          }

          @'
          import importlib.util
          import platform
          import sys

          modules = [
              "PySide6",
              "PySide6.QtOpenGL",
              "PySide6.QtOpenGLWidgets",
              "pyqtgraph",
              "numpy",
              "nuitka",
          ]

          print(f"Python executable: {sys.executable}")
          print(f"Python version: {sys.version}")
          print(f"Platform: {platform.platform()}")
          print()
          for name in modules:
              try:
                  spec = importlib.util.find_spec(name)
                  print(f"{name}: {'FOUND' if spec else 'MISSING'}")
                  if spec:
                      print(f"  origin: {spec.origin}")
              except Exception as exc:
                  print(f"{name}: ERROR: {type(exc).__name__}: {exc}")
          '@ | python - | Tee-Object "$outDir/module_probe.txt"
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.artifact_path }}
            ${{ steps.build.outputs.artifact_path }}.sha256
          compression-level: 0
      - name: Upload environment snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Environment_${{ inputs.module_name }}
          path: Build_Diagnostics/Environment
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics_${{ inputs.module_name }}
          path: .build_work/${{ inputs.module_name }}/diagnostics
          if-no-files-found: warn
