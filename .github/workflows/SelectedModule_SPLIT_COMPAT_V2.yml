name: Build Selected - Hub or Module

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target"
        required: true
        type: choice
        default: service_hub
        options:
          - service_hub
          - module
      hub_style:
        description: "Service Hub style (used only when Build target = service_hub)"
        required: true
        type: choice
        default: hybrid
        options:
          - hybrid
          - zip_drop
          - card_launcher
      module_name:
        description: "Standalone module (used only when Build target = module)"
        required: true
        type: choice
        default: DO_Analysis
        options:
          - Complaint_service_hub
          - DO_Analysis
          - Water_system_analyzer
          - Log_explorer
          - FFT
          - trackerSNR
          - VIMeasure
          - Soni
          - reader
      include_sonication:
        description: "Include Sonication Analysis in Service Hub (used only when Build target = service_hub)"
        required: true
        type: choice
        default: include
        options:
          - include
          - exclude
      include_complaint:
        description: "Include Complaint Service Hub in Service Hub (used only when Build target = service_hub)"
        required: true
        type: choice
        default: include
        options:
          - include
          - exclude
      guide_mode:
        description: "Guide and guided tour"
        required: true
        type: choice
        default: with_guide
        options:
          - with_guide
          - without_guide
      build_mode:
        description: "Reuse a matching completed build, or force a new build"
        required: true
        type: choice
        default: reuse_existing
        options:
          - reuse_existing
          - force_rebuild

permissions:
  contents: read

concurrency:
  group: selected-${{ inputs.build_target }}-${{ inputs.module_name }}-${{ inputs.hub_style }}-${{ inputs.include_sonication }}-${{ inputs.include_complaint }}-${{ inputs.guide_mode }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  INPUT_BUILD_TARGET: ${{ inputs.build_target }}
  INPUT_REQUESTED_MODULE: ${{ inputs.module_name }}
  INPUT_GUIDE_MODE: ${{ inputs.guide_mode }}
  INPUT_HUB_VARIANT: ${{ inputs.hub_style }}
  INPUT_INCLUDE_SONICATION: ${{ inputs.include_sonication }}
  INPUT_INCLUDE_COMPLAINT: ${{ inputs.include_complaint }}
  INPUT_BUILD_MODE: ${{ inputs.build_mode }}

jobs:
  resolve:
    name: Resolve build selection
    runs-on: ubuntu-latest
    outputs:
      module_name: ${{ steps.resolve.outputs.module_name }}
      python_version: ${{ steps.resolve.outputs.python_version }}
      runtime: ${{ steps.resolve.outputs.runtime }}
      cache_tag: ${{ steps.resolve.outputs.cache_tag }}
      guide_enabled: ${{ steps.resolve.outputs.guide_enabled }}
      hub_variant: ${{ steps.resolve.outputs.hub_variant }}
      builder_hub_variant: ${{ steps.resolve.outputs.builder_hub_variant }}
      build_signature: ${{ steps.resolve.outputs.build_signature }}
      source_zip_name: ${{ steps.resolve.outputs.source_zip_name }}
      include_sonication: ${{ steps.resolve.outputs.include_sonication }}
      include_complaint: ${{ steps.resolve.outputs.include_complaint }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: Resolve Registry, SOURCE ZIP and cache signature
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          registry = json.loads((root / "config/module_registry.json").read_text(encoding="utf-8"))

          target = os.environ["INPUT_BUILD_TARGET"]
          module_name = "InSightec_Service_hub" if target == "service_hub" else os.environ["INPUT_REQUESTED_MODULE"]
          if module_name not in registry["modules"]:
              raise SystemExit(f"Registry module not found: {module_name}")

          module_dir = root / "Module" / module_name

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def _split_part_number(path: Path, source_name: str) -> int | None:
              prefix = source_name + ".part"
              if not path.name.startswith(prefix):
                  return None
              suffix = path.name[len(prefix):]
              return int(suffix) if suffix.isdigit() else None

          def _discover_split_groups(directory: Path):
              groups = {}
              for part in directory.glob("*.zip.part*"):
                  if "SOURCE" not in part.name.upper() or not part.is_file():
                      continue
                  marker = part.name.lower().rfind(".zip.part")
                  if marker < 0:
                      continue
                  source_name = part.name[:marker + 4]
                  number = _split_part_number(part, source_name)
                  if number is None:
                      continue
                  groups.setdefault(source_name, []).append((number, part))
              return groups

          def _validate_part_sequence(source_name: str, numbered_parts):
              numbered_parts = sorted(numbered_parts, key=lambda item: item[0])
              numbers = [number for number, _ in numbered_parts]
              expected = list(range(1, len(numbers) + 1))
              if numbers != expected:
                  raise SystemExit(
                      f"Split SOURCE parts for {source_name} are not contiguous: "
                      f"found {numbers}, expected {expected}"
                  )
              return [path for _, path in numbered_parts]

          def _reassemble_without_manifest(directory: Path, source_name: str, parts):
              import zipfile

              source_zip = directory / source_name
              digest = hashlib.sha256()
              total_size = 0
              with source_zip.open("wb") as output_zip:
                  for part_path in parts:
                      with part_path.open("rb") as input_part:
                          for chunk in iter(lambda: input_part.read(1024 * 1024), b""):
                              digest.update(chunk)
                              output_zip.write(chunk)
                              total_size += len(chunk)
              try:
                  with zipfile.ZipFile(source_zip, "r") as archive:
                      entries = archive.infolist()
                      if not entries:
                          raise SystemExit(f"Reassembled SOURCE ZIP is empty: {source_zip.name}")
              except Exception as exc:
                  source_zip.unlink(missing_ok=True)
                  raise SystemExit(f"Reassembled SOURCE ZIP is invalid: {source_zip.name}: {exc}") from exc
              actual_sha = digest.hexdigest().lower()
              print(
                  f"Reassembled split SOURCE without manifest: {source_zip.name} "
                  f"from {len(parts)} part(s), {total_size} bytes, sha256={actual_sha}"
              )
              return source_zip, actual_sha

          def resolve_source_zip(directory: Path):
              # Normal mode: exactly one committed SOURCE ZIP.
              source_zips = sorted(
                  [p for p in directory.glob("*.zip") if "SOURCE" in p.name.upper()],
                  key=lambda p: p.name.lower(),
              )
              split_manifests = sorted(
                  [p for p in directory.glob("*.zip.parts.json") if "SOURCE" in p.name.upper()],
                  key=lambda p: p.name.lower(),
              )
              split_groups = _discover_split_groups(directory)

              if source_zips and (split_manifests or split_groups):
                  raise SystemExit(
                      f"Ambiguous SOURCE in {directory}: both a complete SOURCE ZIP and split SOURCE parts are present. "
                      "Keep only one representation."
                  )
              if len(source_zips) == 1:
                  source_zip = source_zips[0]
                  return source_zip, sha256_file(source_zip)
              if len(source_zips) > 1:
                  names = ", ".join(p.name for p in source_zips)
                  raise SystemExit(f"Expected one SOURCE ZIP in {directory}; found {len(source_zips)}: {names}")

              # Preferred split mode: manifest + parts with full size/SHA verification.
              if len(split_manifests) == 1:
                  manifest_path = split_manifests[0]
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  manifest_format = str(manifest.get("format", "")).strip()
                  manifest_schema = manifest.get("schema_version")
                  if manifest_format != "insightec-source-split-v1" and manifest_schema != 1:
                      raise SystemExit(
                          f"Unsupported split SOURCE manifest: {manifest_path.name}; "
                          f"format={manifest_format!r}, schema_version={manifest_schema!r}"
                      )

                  source_name = str(manifest.get("source_zip") or manifest.get("source_name") or "").strip()
                  if not source_name or not source_name.lower().endswith(".zip") or "SOURCE" not in source_name.upper():
                      raise SystemExit(
                          f"Invalid SOURCE name in {manifest_path.name}: "
                          f"source_zip={manifest.get('source_zip')!r}, source_name={manifest.get('source_name')!r}"
                      )
                  source_zip = directory / source_name
                  parts = manifest.get("parts") or []
                  if not parts:
                      raise SystemExit(f"No parts listed in {manifest_path.name}")

                  digest = hashlib.sha256()
                  total_size = 0
                  with source_zip.open("wb") as output_zip:
                      for index, item in enumerate(parts, start=1):
                          part_name = str(item.get("name", "")).strip()
                          part_path = directory / part_name
                          if not part_path.is_file():
                              raise SystemExit(f"Missing split SOURCE part {index}: {part_name}")
                          expected_size = int(item.get("size", -1))
                          actual_size = part_path.stat().st_size
                          if actual_size != expected_size:
                              raise SystemExit(
                                  f"Split SOURCE part size mismatch: {part_name}: expected {expected_size}, got {actual_size}"
                              )
                          part_digest = hashlib.sha256()
                          with part_path.open("rb") as input_part:
                              for chunk in iter(lambda: input_part.read(1024 * 1024), b""):
                                  part_digest.update(chunk)
                                  digest.update(chunk)
                                  output_zip.write(chunk)
                                  total_size += len(chunk)
                          expected_part_sha = str(item.get("sha256", "")).lower()
                          if part_digest.hexdigest().lower() != expected_part_sha:
                              raise SystemExit(f"Split SOURCE part SHA256 mismatch: {part_name}")

                  expected_total = int(manifest.get("source_size", -1))
                  expected_sha = str(manifest.get("source_sha256", "")).lower()
                  actual_sha = digest.hexdigest().lower()
                  if total_size != expected_total:
                      source_zip.unlink(missing_ok=True)
                      raise SystemExit(
                          f"Reassembled SOURCE size mismatch: expected {expected_total}, got {total_size}"
                      )
                  if actual_sha != expected_sha:
                      source_zip.unlink(missing_ok=True)
                      raise SystemExit(
                          f"Reassembled SOURCE SHA256 mismatch: expected {expected_sha}, got {actual_sha}"
                      )

                  print(f"Reassembled split SOURCE: {source_zip.name} from {len(parts)} part(s)")
                  return source_zip, actual_sha

              if len(split_manifests) > 1:
                  names = ", ".join(p.name for p in split_manifests)
                  raise SystemExit(f"Multiple split SOURCE manifests found in {directory}: {names}")

              # GitHub Web fallback: manifest is optional.  If exactly one SOURCE
              # .zip.part001/.part002/... family exists, reconstruct it by numeric order.
              if len(split_groups) == 1:
                  source_name, numbered_parts = next(iter(split_groups.items()))
                  parts = _validate_part_sequence(source_name, numbered_parts)
                  return _reassemble_without_manifest(directory, source_name, parts)

              if len(split_groups) > 1:
                  names = ", ".join(sorted(split_groups))
                  raise SystemExit(f"Multiple split SOURCE part families found in {directory}: {names}")

              raise SystemExit(
                  f"Expected one SOURCE ZIP, one split SOURCE manifest, or one contiguous SOURCE part family "
                  f"in {directory}; found none"
              )

          source_zip, source_sha = resolve_source_zip(module_dir)

          # A Hub artifact embeds repository module builds. Every selected component
          # SOURCE ZIP must therefore participate in the completed-build signature.
          component_hashes = []
          if target == "service_hub":
              selected_components = list(registry["workflow_selection"]["service_hub_modules"])
              if os.environ["INPUT_INCLUDE_SONICATION"] != "include":
                  selected_components = [name for name in selected_components if name != "Soni"]
              if os.environ["INPUT_INCLUDE_COMPLAINT"] != "include":
                  selected_components = [name for name in selected_components if name != "Complaint_service_hub"]
              for component_name in selected_components:
                  component_dir = root / "Module" / component_name
                  zips = sorted(
                      [p for p in component_dir.glob("*.zip") if "SOURCE" in p.name.upper()],
                      key=lambda p: p.name.lower(),
                  )
                  if len(zips) != 1:
                      names = ", ".join(p.name for p in zips) or "none"
                      raise SystemExit(
                          f"Expected exactly one SOURCE ZIP in {component_dir}; "
                          f"found {len(zips)}: {names}"
                      )
                  component_hashes.append((component_name, hashlib.sha256(zips[0].read_bytes()).hexdigest()))

          framework_files = [root / "config/module_registry.json"]
          framework_files += sorted((root / "scripts").rglob("*.py"))
          framework_hash = hashlib.sha256()
          for path in framework_files:
              framework_hash.update(path.relative_to(root).as_posix().encode())
              framework_hash.update(path.read_bytes())

          module = registry["modules"][module_name]
          runtime = module.get("runtime", registry["defaults"]["runtime"])
          runtime_cfg = registry["runtimes"][runtime]
          guide_enabled = os.environ["INPUT_GUIDE_MODE"] == "with_guide"
          hub_variant = os.environ["INPUT_HUB_VARIANT"] if target == "service_hub" else "standalone_module"
          # Hybrid uses the full card-launcher packaging contract so no tools are pruned,
          # while the Hub SOURCE itself provides the combined card + ZIP-drop Home UI.
          builder_hub_variant = "card_launcher" if hub_variant == "hybrid" else hub_variant
          include_sonication = target != "service_hub" or os.environ["INPUT_INCLUDE_SONICATION"] == "include"
          include_complaint = target != "service_hub" or os.environ["INPUT_INCLUDE_COMPLAINT"] == "include"

          # ZIP-drop is the lightweight analyzer-only Hub variant. Complaint and
          # guide/tour content must never be built, assembled, named, or exposed
          # in this variant, regardless of the workflow choices shown above.
          if target == "service_hub" and hub_variant == "zip_drop":
              guide_enabled = False
              include_complaint = False
          signature_raw = "|".join([
              module_name,
              source_sha,
              framework_hash.hexdigest(),
              runtime,
              hub_variant,
              "guide" if guide_enabled else "no-guide",
              "soni" if include_sonication else "no-soni",
              "complaint" if include_complaint else "no-complaint",
              *[f"{name}:{digest}" for name, digest in component_hashes],
          ])
          signature = hashlib.sha256(signature_raw.encode()).hexdigest()[:24]

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              f.write(f"module_name={module_name}\n")
              f.write(f"python_version={runtime_cfg['python']}\n")
              f.write(f"runtime={runtime}\n")
              f.write(f"cache_tag={runtime_cfg['cache_tag']}\n")
              f.write(f"guide_enabled={'true' if guide_enabled else 'false'}\n")
              f.write(f"hub_variant={hub_variant}\n")
              f.write(f"builder_hub_variant={builder_hub_variant}\n")
              f.write(f"build_signature={signature}\n")
              f.write(f"source_zip_name={source_zip.name}\n")
              f.write(f"include_sonication={'true' if include_sonication else 'false'}\n")
              f.write(f"include_complaint={'true' if include_complaint else 'false'}\n")

          print(f"Target          : {target}")
          print(f"Module          : {module_name}")
          print(f"SOURCE ZIP      : {source_zip.name}")
          print(f"Runtime         : {runtime}")
          print(f"Hub style       : {hub_variant}")
          print(f"Builder variant : {builder_hub_variant}")
          print(f"Guide           : {guide_enabled}")
          print(f"Sonication      : {include_sonication}")
          print(f"Complaint       : {include_complaint}")
          print(f"Build signature : {signature}")

  build:
    name: Build or restore ${{ needs.resolve.outputs.module_name }}
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      INPUT_MODULE_NAME: ${{ needs.resolve.outputs.module_name }}
      INPUT_MODULE_GUIDE: ${{ needs.resolve.outputs.guide_enabled }}
      INPUT_HUB_VARIANT: ${{ needs.resolve.outputs.builder_hub_variant }}
      INPUT_CACHE_SIGNATURE: ${{ needs.resolve.outputs.build_signature }}
      INPUT_INCLUDE_SONICATION: ${{ needs.resolve.outputs.include_sonication }}
      INPUT_INCLUDE_COMPLAINT: ${{ needs.resolve.outputs.include_complaint }}
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble split SOURCE ZIP if required
        shell: python
        env:
          SOURCE_ZIP_NAME: ${{ needs.resolve.outputs.source_zip_name }}
        run: |
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          module_dir = root / "Module" / os.environ["INPUT_MODULE_NAME"]
          source_zip = module_dir / os.environ["SOURCE_ZIP_NAME"]
          manifest_path = module_dir / f"{source_zip.name}.parts.json"

          if source_zip.is_file():
              print(f"Complete SOURCE ZIP already present: {source_zip.name}")
              raise SystemExit(0)

          def part_number(path: Path):
              prefix = source_zip.name + ".part"
              if not path.name.startswith(prefix):
                  return None
              suffix = path.name[len(prefix):]
              return int(suffix) if suffix.isdigit() else None

          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest_format = str(manifest.get("format", "")).strip()
              manifest_schema = manifest.get("schema_version")
              if manifest_format != "insightec-source-split-v1" and manifest_schema != 1:
                  raise SystemExit(
                      f"Unsupported split SOURCE manifest: {manifest_path.name}; "
                      f"format={manifest_format!r}, schema_version={manifest_schema!r}"
                  )
              manifest_source_name = str(manifest.get("source_zip") or manifest.get("source_name") or "").strip()
              if manifest_source_name != source_zip.name:
                  raise SystemExit(
                      f"Split manifest source name mismatch: {manifest_source_name!r} != {source_zip.name!r}"
                  )

              digest = hashlib.sha256()
              total_size = 0
              with source_zip.open("wb") as output_zip:
                  for index, item in enumerate(manifest.get("parts") or [], start=1):
                      part_name = str(item.get("name", "")).strip()
                      part_path = module_dir / part_name
                      if not part_path.is_file():
                          raise SystemExit(f"Missing split SOURCE part {index}: {part_name}")
                      expected_size = int(item.get("size", -1))
                      if part_path.stat().st_size != expected_size:
                          raise SystemExit(f"Split SOURCE part size mismatch: {part_name}")
                      part_digest = hashlib.sha256()
                      with part_path.open("rb") as input_part:
                          for chunk in iter(lambda: input_part.read(1024 * 1024), b""):
                              part_digest.update(chunk)
                              digest.update(chunk)
                              output_zip.write(chunk)
                              total_size += len(chunk)
                      if part_digest.hexdigest().lower() != str(item.get("sha256", "")).lower():
                          raise SystemExit(f"Split SOURCE part SHA256 mismatch: {part_name}")

              expected_size = int(manifest.get("source_size", -1))
              expected_sha = str(manifest.get("source_sha256", "")).lower()
              actual_sha = digest.hexdigest().lower()
              if total_size != expected_size or actual_sha != expected_sha:
                  source_zip.unlink(missing_ok=True)
                  raise SystemExit(
                      f"Reassembled SOURCE verification failed: size {total_size}/{expected_size}, "
                      f"sha256 {actual_sha}/{expected_sha}"
                  )
              print(f"Reassembled and verified split SOURCE: {source_zip.name}")
          else:
              numbered = []
              for part in module_dir.glob(f"{source_zip.name}.part*"):
                  number = part_number(part)
                  if number is not None:
                      numbered.append((number, part))
              numbered.sort(key=lambda item: item[0])
              numbers = [number for number, _ in numbered]
              expected = list(range(1, len(numbers) + 1))
              if not numbered or numbers != expected:
                  raise SystemExit(
                      f"SOURCE ZIP is missing and no valid manifest/contiguous part family was found for {source_zip.name}; "
                      f"parts={numbers}"
                  )

              digest = hashlib.sha256()
              total_size = 0
              with source_zip.open("wb") as output_zip:
                  for _, part_path in numbered:
                      with part_path.open("rb") as input_part:
                          for chunk in iter(lambda: input_part.read(1024 * 1024), b""):
                              digest.update(chunk)
                              output_zip.write(chunk)
                              total_size += len(chunk)
              try:
                  with zipfile.ZipFile(source_zip, "r") as archive:
                      entries = archive.infolist()
                      if not entries:
                          raise RuntimeError("ZIP contains no entries")
              except Exception as exc:
                  source_zip.unlink(missing_ok=True)
                  raise SystemExit(f"Reassembled SOURCE ZIP is invalid: {exc}") from exc
              print(
                  f"Reassembled split SOURCE without manifest: {source_zip.name} from {len(numbered)} part(s), "
                  f"{total_size} bytes, sha256={digest.hexdigest()}"
              )

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.resolve.outputs.python_version }}
          cache: pip
          cache-dependency-path: |
            Module/**/*.zip
            config/module_registry.json

      - name: Audit required fixed module contracts
        shell: pwsh
        run: |
          $auditArgs = @(
            "scripts/contract_audit.py",
            "--target", "${{ inputs.build_target }}",
            "--selected-module", "${{ inputs.module_name }}",
            "--report", "artifacts/contract_audit.json"
          )
          if ("${{ needs.resolve.outputs.include_sonication }}" -ne "true") { $auditArgs += "--exclude-sonication" }
          if ("${{ needs.resolve.outputs.include_complaint }}" -ne "true") { $auditArgs += "--exclude-complaint" }
          python @auditArgs

      - name: Restore completed Artifact Cache
        id: artifact_cache
        if: inputs.build_mode == 'reuse_existing'
        uses: actions/cache/restore@v4
        with:
          path: .artifact-cache/${{ needs.resolve.outputs.build_signature }}
          key: artifact-${{ runner.os }}-${{ needs.resolve.outputs.build_signature }}

      - name: Restore build acceleration caches
        uses: actions/cache@v4
        with:
          path: |
            .build_cache
            .nuitka-cache
            .module-cache
            .builder-cache
          key: framework-${{ runner.os }}-${{ needs.resolve.outputs.cache_tag }}-${{ needs.resolve.outputs.module_name }}-${{ hashFiles('Module/**/*.zip', 'scripts/**/*.py', 'config/module_registry.json') }}
          restore-keys: |
            framework-${{ runner.os }}-${{ needs.resolve.outputs.cache_tag }}-${{ needs.resolve.outputs.module_name }}-
            framework-${{ runner.os }}-${{ needs.resolve.outputs.cache_tag }}-

      - name: Check reusable build
        id: reusable
        shell: pwsh
        run: |
          $metadata = ".artifact-cache/${{ needs.resolve.outputs.build_signature }}/cache_metadata.json"
          $canReuse = "${{ inputs.build_mode }}" -eq "reuse_existing" -and (Test-Path $metadata)
          "available=$($canReuse.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($canReuse) {
            Write-Host "Matching completed build found. Compilation will be skipped."
          } else {
            Write-Host "No exact completed build cache found. A new build is required."
          }

      - name: Preflight source and build contract
        if: steps.reusable.outputs.available != 'true'
        shell: pwsh
        run: |
          $args = @(
            "scripts/preflight_check.py",
            "--module", "${{ needs.resolve.outputs.module_name }}",
            "--source-zip", "${{ needs.resolve.outputs.source_zip_name }}",
            "--hub-variant", "${{ needs.resolve.outputs.builder_hub_variant }}",
            "--report", "artifacts/preflight_${{ needs.resolve.outputs.module_name }}.json"
          )
          if ("${{ needs.resolve.outputs.guide_enabled }}" -eq "true") { $args += "--guide" }
          python @args

      - name: Install build framework
        if: steps.reusable.outputs.available != 'true'
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller "Nuitka==4.1.3" ordered-set zstandard

      - name: Resolve module dependencies
        if: steps.reusable.outputs.available != 'true'
        shell: pwsh
        run: |
          python scripts/dependency_check.py --module "${{ needs.resolve.outputs.module_name }}" --source-zip "${{ needs.resolve.outputs.source_zip_name }}"
          if ("${{ inputs.build_target }}" -eq "service_hub" -and "${{ needs.resolve.outputs.include_sonication }}" -eq "true") {
            python scripts/dependency_check.py --module "Soni"
          }
          if ("${{ inputs.build_target }}" -eq "service_hub" -and "${{ needs.resolve.outputs.include_complaint }}" -eq "true") {
            python scripts/dependency_check.py --module "Complaint_service_hub"
          }


      - name: Build selected target
        id: build
        shell: pwsh
        run: |
          $args = @(
            "scripts/build_manager.py",
            "--module", "${{ needs.resolve.outputs.module_name }}",
            "--source-zip", "${{ needs.resolve.outputs.source_zip_name }}",
            "--hub-variant", "${{ needs.resolve.outputs.builder_hub_variant }}",
            "--cache-signature", "${{ needs.resolve.outputs.build_signature }}"
          )
          if ("${{ needs.resolve.outputs.guide_enabled }}" -eq "true") { $args += "--guide" }
          if ("${{ needs.resolve.outputs.include_sonication }}" -ne "true") { $args += "--exclude-sonication" }
          if ("${{ needs.resolve.outputs.include_complaint }}" -ne "true") { $args += "--exclude-complaint" }
          if ("${{ inputs.build_mode }}" -eq "reuse_existing") { $args += "--reuse-existing" }
          python @args

      - name: Capture build environment
        if: always() && steps.reusable.outputs.available != 'true'
        shell: pwsh
        run: |
          $outDir = "Build_Diagnostics/Environment"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          python --version 2>&1 | Tee-Object "$outDir/python_version.txt"
          python -m pip --version 2>&1 | Tee-Object "$outDir/pip_version.txt"
          python -m pip freeze 2>&1 | Tee-Object "$outDir/pip_freeze.txt"

          $packages = @("PySide6", "shiboken6", "pyqtgraph", "numpy", "nuitka")
          foreach ($package in $packages) {
            $fileName = $package.ToLower() + ".txt"
            python -m pip show $package 2>&1 | Tee-Object (Join-Path $outDir $fileName)
          }

          @'
          import importlib.util
          import platform
          import sys

          modules = [
              "PySide6",
              "PySide6.QtOpenGL",
              "PySide6.QtOpenGLWidgets",
              "pyqtgraph",
              "numpy",
              "nuitka",
          ]

          print(f"Python executable: {sys.executable}")
          print(f"Python version: {sys.version}")
          print(f"Platform: {platform.platform()}")
          print()
          for name in modules:
              try:
                  spec = importlib.util.find_spec(name)
                  print(f"{name}: {'FOUND' if spec else 'MISSING'}")
                  if spec:
                      print(f"  origin: {spec.origin}")
              except Exception as exc:
                  print(f"{name}: ERROR: {type(exc).__name__}: {exc}")
          '@ | python - | Tee-Object "$outDir/module_probe.txt"

      - name: Save completed Artifact Cache
        if: success() && inputs.build_mode == 'reuse_existing' && steps.reusable.outputs.available != 'true'
        uses: actions/cache/save@v4
        with:
          path: .artifact-cache/${{ needs.resolve.outputs.build_signature }}
          key: artifact-${{ runner.os }}-${{ needs.resolve.outputs.build_signature }}

      - name: Upload release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          # Upload the release directory directly. GitHub creates the single outer ZIP.
          # This avoids a ZIP file inside the downloaded Artifact ZIP.
          path: |
            ${{ steps.build.outputs.artifact_path }}/**
          if-no-files-found: error
          compression-level: 0

      - name: Upload environment snapshot
        if: always() && steps.reusable.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Build_Environment_${{ needs.resolve.outputs.module_name }}_${{ github.run_number }}
          path: Build_Diagnostics/Environment
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Diagnostics_${{ needs.resolve.outputs.module_name }}_${{ github.run_number }}
          path: |
            .build_work/${{ needs.resolve.outputs.module_name }}/diagnostics
            artifacts/build_summary.json
            artifacts/preflight_*.json
            artifacts/contract_audit.json
            artifacts/sonication/**
          if-no-files-found: warn
