<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麺笑飯店">
<title>麺笑飯店 支払過不足アプリ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <h1>麺笑飯店</h1>
  <p class="banner-sub">支払い過不足帳</p>
</header>

<main>
  <div class="update-bar">
    <button id="updateBtn" class="btn-update">
      <span class="btn-update-label">更新する</span>
      <span class="btn-update-hint">チェックした人の金額を反映</span>
    </button>
  </div>

  <ul id="personList" class="person-list" aria-live="polite"></ul>

  <p id="emptyState" class="empty-state" hidden>
    まだ誰も登録されていません。<br>下の「追加」から登録しましょう。
  </p>
</main>

<form id="addForm" class="add-bar" autocomplete="off">
  <input
    id="addNameInput"
    type="text"
    class="add-input"
    placeholder="名前を入力"
    maxlength="20"
    required
  >
  <button type="submit" class="btn-add">追加</button>
</form>

<!-- 履歴モーダル -->
<div id="historyOverlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h2 id="historyTitle">履歴</h2>
      <button id="historyClose" class="sheet-close" aria-label="閉じる">×</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
    <p id="historyEmpty" class="empty-state" hidden>まだ履歴がありません。</p>
  </div>
</div>

<!-- トースト通知 -->
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
